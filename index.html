<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>empeo | Performance Review Prototype</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;color:#172033;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}.shell{max-width:1240px;margin:auto;padding:24px 26px 60px}.top{background:#fff;border-bottom:1px solid #e5eaf2}.topin{max-width:1240px;padding:18px 26px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap}.brand{font-size:27px;font-weight:850;letter-spacing:-1.4px;color:#2357cb}.brand span{color:#89a9ec}.brand small{font-size:12px;font-weight:550;letter-spacing:0;margin-left:14px;color:#64748b}.rolewrap{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.small{font-size:12px;color:#64748b}.rolewrap select{border:1px solid #d5ddec;border-radius:10px;padding:10px 12px;background:#fff;color:#25314c}.headline{display:flex;align-items:end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:24px 0}.headline h1{font-size:27px;letter-spacing:-.8px;margin:4px 0}.headline p{color:#64748b;margin:0}.pill{display:inline-flex;align-items:center;border-radius:40px;padding:6px 10px;background:#ecf1fc;color:#2459cc;font-weight:700;font-size:12px}.pill.warn{background:#fff1d8;color:#996100}.pill.green{background:#e4f7ed;color:#087b46}.pill.red{background:#fde9e7;color:#b33131}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.stat{background:white;border:1px solid #e7ebf2;border-radius:15px;padding:19px}.stat .n{font-size:29px;font-weight:780;letter-spacing:-1px;margin-top:8px}.layout{display:grid;grid-template-columns:1fr 330px;gap:18px;margin-top:18px}.panel{background:#fff;border:1px solid #e6eaf2;border-radius:17px;padding:20px;margin-bottom:18px;box-shadow:0 2px 7px #12204005}.panel h2{font-size:17px;margin:0 0 6px}.muted{color:#64748b}.panel .sub{font-size:13px;color:#64748b;margin:0 0 17px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.stack{display:flex;flex-direction:column;gap:12px}.btn{border:0;border-radius:9px;background:#265ad4;color:#fff;padding:11px 14px;font-weight:700;font-size:13px}.btn.secondary{background:#edf2ff;color:#2751b4}.btn.ghost{background:#fff;border:1px solid #d9e2ee;color:#31415b}.btn.danger{background:#b44343}.btn.tiny{padding:7px 10px}.field{display:grid;gap:6px;margin:10px 0}.field label{font-size:12px;color:#42526d;font-weight:700}.field input,.field textarea,.field select{border:1px solid #d9e1ee;border-radius:9px;padding:11px;width:100%;background:white;color:#202d47}.field textarea{min-height:85px;resize:vertical}.people{width:100%;border-collapse:collapse;font-size:13px}.people td,.people th{padding:13px 9px;text-align:left;border-bottom:1px solid #edf0f5}.people th{color:#718099;font-size:11px;text-transform:uppercase;letter-spacing:.6px}.people tr:last-child td{border-bottom:0}.person{font-weight:700}.tbar{height:8px;background:#e8edf7;border-radius:20px;overflow:hidden}.tbar span{display:block;height:100%;background:#3769e5;border-radius:20px}.notice{padding:12px 14px;border:1px solid #f0dfb6;border-radius:11px;background:#fff9ed;color:#7a5c21;font-size:13px;line-height:1.5}.info{padding:12px 14px;background:#f0f5ff;border-radius:11px;color:#36568e;font-size:13px;line-height:1.5}.separator{height:1px;background:#edf0f5;margin:16px 0}.rubric{display:grid;gap:8px;font-size:12px}.rubric>div{display:grid;grid-template-columns:22px 1fr;gap:9px}.score{width:25px;height:25px;border-radius:7px;background:#ebf1ff;color:#285bce;display:grid;place-items:center;font-weight:750}.goal{padding:12px 0;border-bottom:1px solid #edf0f5}.goal:last-child{border-bottom:0}.goal strong{font-size:13px}.goal .muted{font-size:12px}.goalhead{display:flex;justify-content:space-between;margin-bottom:8px;gap:10px}.actions{display:flex;gap:8px;flex-wrap:wrap}.chip{background:#edf4ff;padding:3px 8px;border-radius:8px;color:#2452b4;font-weight:650;font-size:11px}.empty{padding:24px;background:#f8faff;border:1px dashed #cfdbed;border-radius:13px;text-align:center;color:#637490}.toast{position:fixed;bottom:22px;right:22px;background:#19365b;color:#fff;padding:13px 18px;border-radius:10px;box-shadow:0 5px 25px #1234;max-width:360px;display:none;z-index:10}.tabrow{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}.tab{background:#fff;border:1px solid #d9e1ee;color:#52627c;padding:9px 15px;border-radius:9px;font-weight:700;font-size:13px}.tab.active{background:#295ddb;border-color:#295ddb;color:#fff}.footer{font-size:12px;color:#79869c;margin-top:18px}.scoretile{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.scoretile .stat{text-align:center;padding:11px}.scoretile .n{font-size:21px}.locked{padding:25px;text-align:center;background:#f4f7fc;border-radius:15px;border:1px dashed #cbd5e3}.inline{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.inline>*{flex-shrink:0}@media(max-width:920px){.layout{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:580px){.shell{padding:14px}.grid{grid-template-columns:1fr 1fr;gap:9px}.stat{padding:13px}.stat .n{font-size:23px}.people{font-size:11px}.people td,.people th{padding:8px 4px}.scoretile{gap:3px}.scoretile .stat{padding:7px}.scoretile .n{font-size:18px}.headline h1{font-size:22px}}

/* Orange brand theme — matched to supplied empeo test reference */
:root{color:#24222a;background:#fffaf7}
body{background:linear-gradient(180deg,#fff 0,#fff9f6 350px,#fff8f4 100%)}
.top{border-bottom:1px solid #f5dfd5;background:#fff}
.brand{color:#f15b32}.brand span{color:#ffad95}
.brand small,.small,.muted,.panel .sub,.headline p{color:#756c6a}
.rolewrap select,.field input,.field textarea,.field select{border-color:#ead9d2;color:#332b29}
.pill{background:#fff0e9;color:#d94820}
.pill.warn{background:#fff0d9;color:#915900}
.pill.green{background:#e7f7ec;color:#117a43}
.stat,.panel{border-color:#f1e2da;box-shadow:0 3px 16px #ac5e3410}
.btn{background:#f15b32;color:white}
.btn:hover:not(:disabled){background:#dc4922}
.btn.secondary{background:#fff0e9;color:#d44c26}
.btn.ghost{background:white;border-color:#f4d9ca;color:#a9492d}
.btn.danger{background:#b94443}
.tbar{background:#fbe5db}.tbar span{background:#f15b32}
.info{background:#fff0e8;color:#974928}
.score{background:#fff0e8;color:#d84923}
.chip{background:#fff0e8;color:#b84b2d}
.empty{background:#fffaf6;border-color:#efcdbd;color:#987a6c}
.tab{border-color:#efdace;color:#795f55}
.tab.active{background:#f15b32;border-color:#f15b32;color:#fff}
.locked{background:#fff8f3;border-color:#eccbb9}
.people td,.people th{border-bottom-color:#f3e7e1}
.people th,.footer{color:#8d7b73}
.toast{background:#783b28}
.field input:focus,.field textarea:focus,.field select:focus,.rolewrap select:focus{outline:2px solid #f8a58b;outline-offset:2px}
.btn:focus-visible,.tab:focus-visible{outline:3px solid #f8a58b;outline-offset:3px}

/* Fairness review: evidence-first cross-team comparisons */
.fair-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fair-card{padding:15px;border:1px solid #f1ddd3;border-radius:13px;background:#fffaf7}
.fair-card h3{margin:0 0 9px;font-size:15px}
.fair-card .big{font-weight:800;font-size:23px}
.fair-card .metric{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.fair-meter{height:9px;background:#fbe6dc;border-radius:8px;overflow:hidden;margin:7px 0 12px}
.fair-meter span{display:block;height:100%;background:#f15b32;border-radius:8px}
.evidence-box{background:#fff;border:1px solid #f3e5dd;border-radius:9px;padding:11px;line-height:1.5;font-size:13px;min-height:75px}
.fair-select{width:100%;border:1px solid #e9d7ce;border-radius:9px;padding:10px;margin-bottom:10px;color:#372e2b;background:white}
.fair-notes{margin-top:13px;padding:12px;border-left:3px solid #f15b32;background:#fff4ee;border-radius:5px;font-size:12px;line-height:1.6;color:#75432f}
@media(max-width:640px){.fair-grid{grid-template-columns:1fr}}


/* Clear, accessible rating distribution */
.fair-ratings-title{display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:#57473f;margin:14px 0 9px}
.fair-ratings-title span{font-weight:400;color:#8d766a}
.fair-rating-list{display:grid;gap:8px}
.fair-rating-row{display:grid;grid-template-columns:70px minmax(0,1fr) 28px;align-items:center;gap:10px;font-size:12px}
.fair-rating-label{color:#66554d;white-space:nowrap}
.fair-rating-track{height:8px;border-radius:20px;background:#f9e9e2;overflow:hidden}
.fair-rating-track>span{display:block;height:100%;border-radius:20px;background:#f15b32}
.fair-rating-count{text-align:right;color:#2b2320;font-weight:700;font-variant-numeric:tabular-nums}

.po-steps,.po-groups{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.po-step,.po-group{border:1px solid #f2ded2;border-radius:12px;padding:14px;background:#fffaf7}
.po-step.active{border-color:#f15b32;background:#fff1ea}
.po-step.complete{border-color:#b9dfc2;background:#f4fbf5}
.po-step strong,.po-group strong{display:block;margin:5px 0}.po-step p{font-size:12px;color:#75645d;line-height:1.5;margin:4px 0}
.po-group b{font-size:28px}.po-caption{font-size:12px;color:#77675f}.po-context{background:#fff3eb;border-left:3px solid #f15b32;border-radius:8px;padding:14px;margin:14px 0;font-size:13px;line-height:1.6}.po-context ul{padding-left:20px}
.po-alert{padding:13px;border-radius:9px;border:1px solid #f0c8b5;background:#fff0e7;color:#853d20;margin:12px 0;font-size:13px}
@media(max-width:650px){.po-steps,.po-groups{grid-template-columns:1fr}}
</style>
</head>
<body><header class="top"><div class="topin"><div class="brand">empeo<span>●</span><small>Performance Hub · Concept Prototype</small></div><div class="rolewrap"><span class="small">Explore as</span><select id="role" aria-label="Choose demo role"><option value="hr">HR Admin · Nina</option><option value="m1">Manager · Alex (Sales)</option><option value="m2">Manager · Jordan (Engineering)</option><option value="e1">Employee · Maya</option><option value="e4">Employee · Noah</option></select><button class="btn ghost tiny" id="reset">Reset demo</button></div></div></header><main class="shell"><div id="app"></div><div class="footer">Interactive hiring-exercise prototype · Demo-only data · Role switching is a demonstration, not production authentication or access control.</div></main><div id="toast" class="toast" role="status"></div>
<script>
'use strict';
const KEY='empeo-po-demo-v1-20261119';
const rubric=[['Outstanding','Exceptional impact, consistently exceeds goals and demonstrates clear evidence'],['Exceeds expectations','Above agreed goals in important areas with documented examples'],['Meets expectations','Delivers agreed outcomes and expected role behaviors'],['Partially meets','Some important outcomes are missed; improvement plan is needed'],['Does not meet','Critical objectives not met; concrete performance gaps documented']];
const original=()=>({cycle:{name:'2026 Annual Performance Review',deadline:'2026-12-15',stage:'open',reminderCount:0},people:[
{id:'e1',name:'Maya Chen',team:'Sales',manager:'m1',goals:[{name:'Grow renewal revenue',weight:60,progress:100},{name:'Improve response time',weight:40,progress:90}],review:{rating:5,evidence:'Exceeded renewal target by 18% and reduced response time by 22%.',status:'submitted'}},
{id:'e2',name:'Leo Park',team:'Sales',manager:'m1',goals:[{name:'Close qualified opportunities',weight:70,progress:92},{name:'Maintain CRM hygiene',weight:30,progress:100}],review:{rating:4,evidence:'Delivered 92% of target and consistent CRM discipline.',status:'submitted'}},
{id:'e3',name:'Ava Patel',team:'Sales',manager:'m1',goals:[{name:'Improve conversion rate',weight:60,progress:70},{name:'Build pipeline',weight:40,progress:80}],review:{rating:null,evidence:'',status:'pending'}},
{id:'e4',name:'Noah Kim',team:'Engineering',manager:'m2',goals:[{name:'Ship agreed platform milestones',weight:60,progress:100},{name:'Reduce critical incidents',weight:40,progress:100}],review:{rating:3,evidence:'Completed planned milestones and met incident-reduction objective.',status:'submitted'}},
{id:'e5',name:'Emma Davis',team:'Engineering',manager:'m2',goals:[{name:'Ship accessible design updates',weight:50,progress:75},{name:'Increase test coverage',weight:50,progress:65}],review:{rating:2,evidence:'Missed two committed milestones; coverage remained under goal.',status:'submitted'}},
{id:'e6',name:'Oliver Reed',team:'Engineering',manager:'m2',goals:[{name:'Improve onboarding flow',weight:60,progress:65},{name:'Resolve reliability backlog',weight:40,progress:50}],review:{rating:null,evidence:'',status:'pending'}}
]});
let data;try{data=JSON.parse(localStorage.getItem(KEY))||original()}catch{data=original()}let role='hr',selected='e3',tab='overview';
let fairnessLeft='e1',fairnessRight='e4';
const $=id=>document.getElementById(id),save=()=>localStorage.setItem(KEY,JSON.stringify(data));
const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=s=>new Date(s+'T12:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
const people=()=>data.people,submitted=()=>people().filter(p=>p.review.status==='submitted'),completion=()=>Math.round(submitted().length/people().length*100);
const past=()=>new Date(data.cycle.deadline+'T23:59:59')<new Date();
const reviewClosed=()=>data.cycle.stage==='published'||past();
const localISO=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');
const dayOffset=n=>{const d=new Date();d.setDate(d.getDate()+n);return localISO(d)};
function label(status){return `<span class="pill ${status==='submitted'||status==='published'?'green':status==='pending'?'warn':''}">${escapeHTML(status)}</span>`}
function toast(s){const t=$('toast');t.textContent=s;t.style.display='block';clearTimeout(window._toastTimer);window._toastTimer=setTimeout(()=>t.style.display='none',3000)}
const h=(title,subtitle)=>`<div class="headline"><div><span class="pill">${escapeHTML(data.cycle.name)}</span><h1>${title}</h1><p>${subtitle}</p></div><div class="inline"><span class="small">Deadline: <b>${fmt(data.cycle.deadline)}</b></span>${label(data.cycle.stage)}</div></div>`;
const stats=()=>`<div class="grid"><div class="stat"><div class="small">People in cycle</div><div class="n">${people().length}</div></div><div class="stat"><div class="small">Reviews completed</div><div class="n">${submitted().length}/${people().length}</div></div><div class="stat"><div class="small">Completion</div><div class="n">${completion()}%</div></div><div class="stat"><div class="small">Pending reviews</div><div class="n">${people().length-submitted().length}</div></div></div>`;
function goalBlocks(p,editable){return p.goals.map((g,i)=>`<div class="goal"><div class="goalhead"><strong>${escapeHTML(g.name)} <span class="chip">${g.weight}% weight</span></strong><b>${g.progress}%</b></div><div class="tbar"><span style="width:${g.progress}%"></span></div>${editable?`<div class="field"><label>Update progress (%)</label><input aria-label="${escapeHTML(g.name)} progress" type="number" min="0" max="100" value="${g.progress}" data-progress="${p.id}:${i}"></div>`:''}</div>`).join('')}
function rubricPanel(){return `<div class="panel"><h2>Shared performance rubric</h2><p class="sub">Same behavioral anchors for every manager. Ratings require documented evidence.</p><div class="rubric">${rubric.map((r,i)=>`<div><span class="score">${5-i}</span><span><b>${r[0]}</b><br><span class="muted">${r[1]}</span></span></div>`).join('')}</div></div>`}

function fairGoals(p){return p.goals.map(g=>`<div class="small" style="margin:7px 0"><b>${escapeHTML(g.name)}</b> · ${g.weight}% weight · ${g.progress}% progress</div>`).join('')}
function fairEmployee(p,selector){
  const list=submitted();const other=selector==='fairLeft'?fairnessRight:fairnessLeft;
  return `<div class="fair-card"><label class="small" for="${selector}"><b>Compare employee</b></label>
  <select class="fair-select" id="${selector}" aria-label="Select employee for comparison">${list.map(x=>`<option value="${x.id}" ${x.id===p.id?'selected':''} ${x.id===other&&x.id!==p.id?'disabled':''}>${escapeHTML(x.name)} · ${escapeHTML(x.team)}</option>`).join('')}</select>
  <div class="metric"><h3>${escapeHTML(p.name)}</h3><span class="pill">Rating ${p.review.rating}/5</span></div>
  <p class="small">${escapeHTML(p.team)} · ${rubric[5-p.review.rating][0]}</p>
  <div class="separator"></div>
  <b class="small">Goal context</b>${fairGoals(p)}
  <div class="separator"></div><b class="small">Manager's evidence</b>
  <div class="evidence-box">${escapeHTML(p.review.evidence)}</div></div>`;
}
function fairnessPanel(){
  const teams=[...new Set(people().map(p=>p.team))];
  const rows=teams.map(team=>{const members=submitted().filter(p=>p.team===team);return {team,members,avg:members.length?members.reduce((sum,p)=>sum+p.review.rating,0)/members.length:null}});
  const options=submitted(),a=options.find(p=>p.id===fairnessLeft)||options[0],b=options.find(p=>p.id===fairnessRight&&p.id!==a?.id)||options.find(p=>p.id!==a?.id)||options[0];if(a)fairnessLeft=a.id;if(b)fairnessRight=b.id;
  return `<div class="panel" id="fairness-review"><div class="row"><div><h2>Fairness review · cross-team evidence</h2>
  <p class="sub">Compare rating patterns and the evidence behind them. A discussion aid, not a ranking or calibration engine.</p></div><span class="pill">HR only · demo</span></div>
  <div class="fair-grid">${rows.map(t=>`<div class="fair-card"><div class="metric"><h3>${escapeHTML(t.team)}</h3><span class="small">${t.members.length} submitted / ${people().filter(p=>p.team===t.team).length}</span></div>
  <div class="big">${t.avg===null?'—':t.avg.toFixed(1)}<span class="small"> / 5 mean rating</span></div>
  <div class="fair-meter"><span style="width:${t.avg===null?0:t.avg*20}%"></span></div>
  <div class="fair-ratings-title">Rating distribution <span>Employees</span></div><div class="fair-rating-list">${[5,4,3,2,1].map(n=>{const count=t.members.filter(p=>p.review.rating===n).length;return `<div class="fair-rating-row"><span class="fair-rating-label">Rating ${n}</span><div class="fair-rating-track"><span style="width:${t.members.length?100*count/t.members.length:0}%"></span></div><span class="fair-rating-count">${count}</span></div>`}).join('')}</div></div>`).join('')}</div>
  <div class="separator"></div><h3 style="font-size:14px;margin:0 0 8px">Compare two employees & supporting evidence</h3>
  ${options.length>=2?`<div class="fair-grid">${fairEmployee(a,'fairLeft')}${fairEmployee(b,'fairRight')}</div>`:'<div class="empty">At least two submitted reviews are needed to compare evidence.</div>'}
  <div class="po-context"><b>Review considerations</b>
${a&&b?`<p>${escapeHTML(a.name)} (${a.review.rating}/5) and ${escapeHTML(b.name)} (${b.review.rating}/5): ${a.review.rating===b.review.rating?'The same rating does not guarantee comparable work.':'The ratings differ; HR should examine the reasons, not assume unfairness.'}</p>`:''}
<ul><li>Were the same rating criteria applied?</li><li>How do role scope, goal difficulty, outcomes and supporting evidence differ?</li><li>Would either rating benefit from manager discussion?</li></ul><b>Informational only:</b> no score changes or automatic bias judgments.</div>
<div class="fair-notes"><b>What HR should check:</b> Are managers applying the same rubric? Are the outcomes and evidence comparable? Do goal difficulty, role scope and opportunity explain differences? 
  <br><b>Important:</b> Differences in team averages do not prove bias. This six-person dataset is too small for statistical conclusions. No scores are automatically changed, and cross-team calibration is <b>not yet implemented</b>.</div>
  </div>`;
}


function performanceOverview(){
 const rated=submitted(),high=rated.filter(p=>p.review.rating>=4),mid=rated.filter(p=>p.review.rating===3),low=rated.filter(p=>p.review.rating<=2);
 return `<div class="panel"><h2>Performance overview · provisional</h2><p class="sub">Identify groups for further review, not a definitive ranking. Pending reviews are excluded.</p><div class="po-groups">
 <div class="po-group"><span class="po-caption">High performance · ratings 4–5</span><b>${high.length}</b><p class="po-caption">Check supporting impact evidence</p></div>
 <div class="po-group"><span class="po-caption">Meets expectations · rating 3</span><b>${mid.length}</b><p class="po-caption">Consistent delivery against role goals</p></div>
 <div class="po-group"><span class="po-caption">Needs support · ratings 1–2</span><b>${low.length}</b><p class="po-caption">Consider development and feedback</p></div>
 </div><p class="small" style="margin:12px 0 0">These provisional groups reflect manager ratings, not calibrated decisions or employee potential.</p></div>`;
}
function workflowPanel(){
 const published=data.cycle.stage==='published',complete=submitted().length===people().length;
 const steps=[['Manager reviews','Shared criteria and documented evidence',!complete&&!published,complete||published],['HR readiness','All submissions and fairness review',complete&&!published,published],['Results released','Employees see their own published outcome',published,published]];
 return `<div class="panel"><h2>Review workflow status</h2><p class="sub">v1 process: cross-team calibration is not implemented.</p>
 <div class="po-steps">${steps.map(([name,description,active,done],i)=>`<div class="po-step ${active?'active':done?'complete':''}"><span class="po-caption">${done?'Completed':active?'Current':'Upcoming'} · Step ${i+1}</span><strong>${name}</strong><p>${description}</p></div>`).join('')}</div>
 ${past()&&!published?'<div class="po-alert"><b>Deadline overdue.</b> Manager submissions are paused until HR extends the deadline.</div>':''}</div>`;
}
function hr(){const pending=people().filter(p=>p.review.status==='pending');const groups=[5,4,3,2,1].map(r=>({r,n:submitted().filter(p=>p.review.rating===r).length}));return h('Review cycle overview','Track progress, spot inconsistency, and control when results are released.')+stats()+performanceOverview()+workflowPanel()+`<div class="layout"><div><div class="panel"><div class="row"><div><h2>Review status by employee</h2><p class="sub">One evidence-backed rating scale across teams</p></div><span class="pill">${completion()}% complete</span></div><div style="overflow:auto"><table class="people"><thead><tr><th>Employee</th><th>Team</th><th>Rating</th><th>Review</th></tr></thead><tbody>${people().map(p=>`<tr><td class="person">${p.name}</td><td>${p.team}</td><td>${p.review.rating??'—'}</td><td>${label(p.review.status)}</td></tr>`).join('')}</tbody></table></div></div><div class="panel"><h2>Rating distribution · submitted reviews</h2><p class="sub">A diagnostic signal, not an automatic ranking or forced curve</p><div class="scoretile">${groups.map(o=>`<div class="stat"><span class="small">Rating ${o.r}</span><div class="n">${o.n}</div></div>`).join('')}</div><div class="separator"></div><p class="small">Watch for rating patterns across teams; investigate context and evidence before making decisions. Ratings are not normalized automatically.</p></div>${fairnessPanel()}<div class="panel"><h2>Manage cycle</h2><div class="field"><label>Review deadline</label><input type="date" id="deadline" value="${data.cycle.deadline}" ${data.cycle.stage==='published'?'disabled':''}></div><div class="actions"><button class="btn secondary" id="updateDeadline" ${data.cycle.stage==='published'?'disabled':''}>Save / extend deadline</button><button class="btn ghost" id="remind" ${!pending.length||data.cycle.stage==='published'?'disabled':''}>Send demo reminders (${pending.length})</button><button class="btn ghost" id="simulateOverdue" ${data.cycle.stage==='published'||past()?'disabled':''}>Simulate missed deadline</button><button class="btn secondary" id="extendWeek" ${data.cycle.stage==='published'?'disabled':''}>Extend +7 days</button></div><p class="small">Reminders are simulated; no real notification is sent. After a missed deadline, HR must extend the deadline to allow further submissions. Total demo reminders: ${data.cycle.reminderCount}.</p></div></div><div><div class="panel"><h2>Release controls</h2><p class="sub">Employees cannot see confidential ratings before HR publishes.</p>${pending.length?`<div class="notice"><b>${pending.length} reviews pending${past()?' · Deadline missed':''}</b><br>${pending.map(p=>p.name).join(', ')}. Managers must complete reviews before publication. ${past()?'HR must extend the deadline before managers can submit.':''}</div>`:`<div class="info">All employee reviews are submitted. HR can publish results.</div>`}<div class="separator"></div>${data.cycle.stage==='published'?`<span class="pill green">Results are visible to employees</span>`:`<button class="btn" id="publish" ${pending.length?'disabled':''}>Publish employee results</button>`}<p class="small">v1 release gate: all submitted → HR publishes. Cross-team calibration is intentionally deferred (see exam Part 2).</p></div>${rubricPanel()}<div class="panel"><h2>Fairness guardrails</h2><p class="sub">Transparent criteria rather than a blind average.</p><div class="stack"><span class="small">✓ One shared 1–5 rubric</span><span class="small">✓ Goal-weight visibility</span><span class="small">✓ Written evidence is required</span><span class="small">✓ HR can review team rating spread</span><span class="small">✓ All-review completion gate before release</span></div></div></div></div>`}
function manager(){const team=people().filter(p=>p.manager===role),p=team.find(p=>p.id===selected)||team[0];selected=p.id;return h('Manager review workspace',`Review your ${p.team} team with consistent rating anchors and evidence.`)+`<div class="grid"><div class="stat"><div class="small">Team members</div><div class="n">${team.length}</div></div><div class="stat"><div class="small">Submitted</div><div class="n">${team.filter(p=>p.review.status==='submitted').length}</div></div><div class="stat"><div class="small">Pending</div><div class="n">${team.filter(p=>p.review.status==='pending').length}</div></div><div class="stat"><div class="small">Deadline</div><div style="font-weight:780;margin-top:11px">${fmt(data.cycle.deadline)}</div></div></div><div class="layout"><div><div class="panel"><h2>Select team member</h2><div class="tabrow">${team.map(p=>`<button class="tab ${selected===p.id?'active':''}" data-person="${p.id}">${p.name} ${p.review.status==='submitted'?'✓':'·'}</button>`).join('')}</div><div class="row"><div><h2>${p.name}</h2><p class="sub">${p.team} · Goals total ${p.goals.reduce((a,g)=>a+g.weight,0)}% weight</p></div>${label(p.review.status)}</div><div>${goalBlocks(p,false)}</div><div class="separator"></div><h2>Performance review</h2><p class="sub">Rate impact against the shared company rubric. Evidence is required; goal progress is context, not an automatic rating.</p><div class="field"><label>Overall rating (1–5)</label><select id="rating" ${reviewClosed()?'disabled':''}><option value="">Select a rating</option>${rubric.map((r,i)=>`<option value="${5-i}" ${p.review.rating===5-i?'selected':''}>${5-i} · ${r[0]}</option>`).join('')}</select></div><div class="field"><label>Evidence: results, examples, and context</label><textarea id="evidence" ${reviewClosed()?'disabled':''} placeholder="What outcomes were achieved? Which observable examples support this rating?">${escapeHTML(p.review.evidence)}</textarea></div><button class="btn" id="submitReview" ${reviewClosed()?'disabled':''}>${p.review.status==='submitted'?'Update submitted review':'Submit review'}</button><p class="small">In this v1 concept, managers can edit their own submitted review until HR publishes results.</p></div></div><div>${past()&&data.cycle.stage!=='published'?'<div class="po-alert">The review deadline has passed. Ask HR to extend it to resume rating or editing.</div>':''}${rubricPanel()}<div class="panel"><h2>Why evidence matters</h2><p class="sub">A rating without observable examples is easy to bias. This prototype prevents empty justifications, but it does not claim to eliminate bias.</p></div></div></div>`}
function employee(){const p=people().find(p=>p.id===role),published=data.cycle.stage==='published';return h('My performance',`Welcome, ${p.name}. Track your goals and review outcome.`)+`<div class="layout"><div><div class="panel"><div class="row"><div><h2>My goals</h2><p class="sub">${p.team} · Annual 2026 · Weights sum to 100%</p></div><span class="pill">Employee view</span></div>${goalBlocks(p,data.cycle.stage!=='published')}<div class="separator"></div>${data.cycle.stage!=='published'?'<button class="btn" id="saveProgress">Save goal progress</button>':'<span class="small">Goal progress is read-only after results are published.</span>'}</div><div class="panel"><h2>My annual review result</h2>${!published?`<div class="locked"><div style="font-size:31px">🔒</div><h2>Results aren't published yet</h2><p class="muted">HR will release outcomes after the review cycle is ready. Your manager's private rating is hidden.</p></div>`:p.review.status==='submitted'?`<div class="stat"><div class="small">Final performance rating</div><div class="n">${p.review.rating}/5</div><strong>${rubric[5-p.review.rating][0]}</strong><p class="muted">${escapeHTML(p.review.evidence)}</p></div>`:'<div class="notice">Your review has not been completed yet. Please contact HR.</div>'}</div></div><div>${rubricPanel()}<div class="panel"><h2>How evaluations work</h2><p class="sub">Managers assess documented goal outcomes against common criteria. HR oversees completion and publishes the cycle.</p></div></div></div>`}
function render(){const root=$('app');if(role==='hr')root.innerHTML=hr();else if(role.startsWith('m'))root.innerHTML=manager();else root.innerHTML=employee();bind()}
function bind(){const fLeft=$('fairLeft'),fRight=$('fairRight');if(fLeft)fLeft.onchange=e=>{if(e.target.value===fairnessRight){toast('Choose two different employees.');render();return}fairnessLeft=e.target.value;render()};if(fRight)fRight.onchange=e=>{if(e.target.value===fairnessLeft){toast('Choose two different employees.');render();return}fairnessRight=e.target.value;render()};document.querySelectorAll('[data-person]').forEach(b=>b.addEventListener('click',()=>{selected=b.dataset.person;render()}));const u=$('updateDeadline');if(u)u.onclick=()=>{const d=$('deadline').value;if(!d){toast('Choose a valid deadline.');return}if(d<dayOffset(0)){toast('Choose today or a future deadline.');return}data.cycle.deadline=d;save();render();toast('Review deadline updated.')};const sim=$('simulateOverdue');if(sim)sim.onclick=()=>{if(data.cycle.stage==='published')return;data.cycle.deadline=dayOffset(-2);save();render();toast('Demo now overdue. Extend the deadline to continue.')};
const extend=$('extendWeek');if(extend)extend.onclick=()=>{if(data.cycle.stage==='published')return;const d=new Date(Math.max(Date.now(),new Date(data.cycle.deadline+'T12:00:00').getTime()));d.setDate(d.getDate()+7);data.cycle.deadline=localISO(d);save();render();toast('Deadline extended. Managers can submit again.')};
const r=$('remind');if(r)r.onclick=()=>{data.cycle.reminderCount++;save();render();toast('Demo reminders recorded; no email was sent.')};const pub=$('publish');if(pub)pub.onclick=()=>{if(submitted().length!==people().length){toast('Complete all reviews before publishing.');return}if(!confirm('Publish all submitted ratings to employees? This locks editing in the demo.'))return;data.cycle.stage='published';save();render();toast('Results published. Switch to an employee view to verify.')};const sr=$('submitReview');if(sr)sr.onclick=()=>{if(reviewClosed()){toast('Deadline passed or results already published.');return}const p=people().find(p=>p.id===selected);const rating=Number($('rating').value);const evidence=$('evidence').value.trim();if(!Number.isInteger(rating)||rating<1||rating>5){toast('Select a valid 1–5 rating.');return}if(evidence.length<20){toast('Please add at least 20 characters of concrete evidence.');return}p.review={rating,evidence,status:'submitted'};save();render();toast('Review submitted with evidence.')};const sp=$('saveProgress');if(sp)sp.onclick=()=>{const p=people().find(p=>p.id===role);const all=[...document.querySelectorAll('[data-progress]')];for(const i of all){const val=Number(i.value);if(!Number.isFinite(val)||val<0||val>100){toast('Goal progress must be 0–100%.');return}const ix=Number(i.dataset.progress.split(':')[1]);p.goals[ix].progress=val}save();render();toast('Goal progress saved.')}}
$('role').addEventListener('change',e=>{role=e.target.value;selected=role==='m2'?'e6':'e3';render()});$('reset').addEventListener('click',()=>{if(!confirm('Reset this interactive demo to its sample data?'))return;data=original();save();render();toast('Demo reset.')});render();
</script></body></html>
